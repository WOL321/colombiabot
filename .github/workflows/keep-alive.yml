name: Colombia Pride Bot

on:
  schedule:
    # Runs every 50 minutes (bot stays online for 2 minutes)
    # This keeps us under GitHub's 2,000 minutes/month limit
    - cron: '*/50 * * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r bot/requirements.txt
    
    - name: Run bot (stays online for ~2 minutes, commands work!)
      env:
        DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        DISCORD_POLL_CHANNEL_ID: ${{ secrets.DISCORD_POLL_CHANNEL_ID }}
      run: python bot/bot_github.py
      timeout-minutes: 5
